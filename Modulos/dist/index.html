<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo 3</title>
  <script type="module" crossorigin src="/assets/index-Bfyij1hf.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BPzPQFuj.css">
</head>
<body>
    <div class="container">
        <h1>Módulo de Gestión de Tareas ADSO</h1>

        <div id="userNameError" class="alerta-mensaje"></div>

        <form id="messageForm">
            <div class="form-group">
                <label for="userName">ID del Usuario:</label>
                <input type="number" id="userName" placeholder="Ej: 1" min="1">
            </div>
            
            <div class="form-group">
                <label for="userMessage">Descripción de la Tarea:</label>
                <input type="text" id="userMessage" placeholder="Escribe la descripción de la tarea...">
            </div>

            <button type="submit">Guardar Tarea</button>
        </form>

        <div class="toolbar">
            <div class="toolbar-section">
                <h3>Filtrar tareas</h3>
                <div class="toolbar-row">
                    <select id="filterEstado">
                        <option value="">Todos los estados</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="En Proceso">En Proceso</option>
                        <option value="Completada">Completada</option>
                    </select>
                    <input type="number" id="filterUsuario" placeholder="ID Usuario" min="1">
                    <button id="btnApplyFilter" class="btn-filtrar">Aplicar Filtro</button>
                    <button id="btnClearFilter" class="btn-limpiar">Limpiar</button>
                </div>
            </div>

            <div class="toolbar-section">
                <h3>Ordenar tareas</h3>
                <div class="toolbar-row">
                    <select id="sortCriterio">
                        <option value="fecha">Fecha de creación</option>
                        <option value="nombre">Nombre de la tarea</option>
                        <option value="estado">Estado</option>
                    </select>
                    <select id="sortOrden">
                        <option value="asc">Ascendente</option>
                        <option value="desc">Descendente</option>
                    </select>
                    <button id="btnApplySort" class="btn-ordenar">Ordenar</button>
                </div>
            </div>

            <div class="toolbar-section">
                <button id="btnExport" class="btn-exportar">Exportar tareas visibles (JSON)</button>
            </div>
        </div>

        <div class="meta-info">
            <span id="messageCount">0 tareas registradas</span>
        </div>

        <table class="tabla-tareas">
            <thead>
                <tr>
                    <th>ID Usu.</th>
                    <th>Nombre Usuario</th>
                    <th>Descripción de la Tarea</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="messagesContainer">
                <tr id="emptyState">
                    <td colspan="5" style="text-align: center; color: gray; padding: 20px;">
                        No hay tareas registradas en el sistema.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
